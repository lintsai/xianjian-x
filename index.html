<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>《仙劍X：霧魂殘夢》— 經典45度斜視角仙俠RPG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ================= 標題首頁 ================= -->
  <section id="title-screen" class="title-screen">
    <canvas id="title-canvas" width="960" height="580"></canvas>
    <div class="title-overlay">
      <div class="title-emblem">神農九泉 · 五靈宿命 · 參照仙劍一經典玩法</div>
      <h1 class="title-logo">仙劍<span>X</span>：霧魂殘夢</h1>
      <p class="title-poem">一壺桂酒江湖夢，十載霧魂宿命人</p>
      <div class="title-actions">
        <button id="btn-title-new" class="pal-btn-lg">⚔️ 新的故事（初入江湖）</button>
        <button id="btn-title-load" class="pal-btn-lg">📜 舊夢重溫（讀取卷軸）</button>
        <button id="btn-title-lore" class="pal-btn-lg secondary">☯️ 六界九泉錄（仙劍1~7典籍）</button>
      </div>
      <div class="title-footer">
        操作：8向 WASD／方向鍵、滑鼠點擊或長按拖曳行走（Shift 疾行）｜ 空白鍵／點擊調查翻箱 ｜ 戰鬥快捷鍵 A圍攻 F仙術 D防禦 W投擲 R重複 Q逃跑
      </div>
    </div>
  </section>

  <!-- ================= 主遊戲舞台 ================= -->
  <main id="game-stage" class="game-stage hidden">
    <!-- 頂部古風狀態列 -->
    <header id="top-hud" class="top-hud">
      <div class="hud-left">
        <div id="hud-map-title" class="hud-map-title">第一章·臨安晨鐘 ｜ 臨安渡·忘憂客棧</div>
        <div class="hud-quest-row">🧭 <span id="hud-quest-text">在客棧內翻找桂花酒</span></div>
      </div>
      <div id="hud-party-mini" class="hud-party-mini"></div>
      <div class="hud-right">
        <span class="hud-gold-box">🪙 <b id="hud-gold">260 文</b></span>
        <button id="btn-hud-audio" class="pal-btn-sm">🎵 仙樂開</button>
        <button id="btn-hud-menu" class="pal-btn-sm">📖 選單 [Esc]</button>
      </div>
    </header>

    <!-- 45度斜視角地圖與對角戰鬥 Canvas 容器 -->
    <div class="canvas-viewport">
      <canvas id="game-canvas" width="960" height="580"></canvas>

      <!-- 360度絲滑虛擬搖桿與快捷調查／御風疾行鈕（支援手機觸控長按拖曳與滑鼠單手操作） -->
      <div id="virtual-controls" class="virtual-controls">
        <div id="vjoy-pad" class="vjoy-pad" title="按住或拖曳任意方向連續行走">
          <span class="vjoy-tick t-up">▲</span>
          <span class="vjoy-tick t-right">▶</span>
          <span class="vjoy-tick t-down">▼</span>
          <span class="vjoy-tick t-left">◀</span>
          <div id="vjoy-knob" class="vjoy-knob">☯</div>
        </div>
        <div class="vctrl-actions">
          <button id="btn-vsprint" class="vact-btn sprint" title="切換御風疾行 [Shift]">疾</button>
          <button id="btn-vact" data-dpad="act" class="vact-btn act" title="調查 / 對話 [空白鍵]">查</button>
        </div>
      </div>

      <!-- ================= 仙劍1經典45度斜視角戰鬥介面 ================= -->
      <div id="battle-overlay" class="battle-overlay hidden">
        <div class="battle-top-bar">
          <div id="battle-log-bar" class="battle-log-bar">妖魔攔路，拔劍迎敵！</div>
          <div id="battle-enemy-targets" class="battle-enemy-targets"></div>
        </div>

        <!-- 仙術 / 物品 / 投擲 展開抽屜 -->
        <div id="battle-drawer" class="battle-drawer hidden">
          <div class="bdrawer-header">
            <span id="bdrawer-title">仙術武學</span>
            <button id="btn-bdrawer-close" class="pal-btn-xs">✕ 關閉</button>
          </div>
          <div id="bdrawer-list" class="bdrawer-list"></div>
        </div>

        <!-- 左下角：仙劍1經典十字菱形四向指令盤 -->
        <div class="battle-bottom-ui">
          <div class="battle-command-zone">
            <div id="battle-turn-actor" class="battle-turn-actor">▶ 陸逍 出招</div>
            <div class="diamond-menu">
              <button id="cmd-attack" class="diamond-btn d-up" title="普通攻擊（雙劍二連擊／長鞭全體橫掃）">
                <span>攻</span><small>武術</small>
              </button>
              <button id="cmd-magic" class="diamond-btn d-left" title="五靈仙術／蜀山劍訣／飛雲探龍手">
                <span>仙</span><small>仙術</small>
              </button>
              <button id="cmd-coop" class="diamond-btn d-right" title="多人同心合擊（配戴五靈珠可召神明！）">
                <span>合</span><small>合擊</small>
              </button>
              <button id="cmd-item" class="diamond-btn d-down" title="服用丹藥靈果或投擲暗器武器">
                <span>物</span><small>道具</small>
              </button>
            </div>
            <div class="battle-quick-strip">
              <button data-bquick="siege" title="全員自動普攻 [A]">圍攻[A]</button>
              <button data-bquick="strongest" title="自動施放最強仙術 [F]">強仙[F]</button>
              <button data-bquick="throw" title="投擲暗器或備用武器 [W]">投擲[W]</button>
              <button data-bquick="defend" title="防禦減半傷害 [D]">防禦[D]</button>
              <button data-bquick="repeat" title="重複上回合招式 [R]">重複[R]</button>
              <button data-bquick="flee" title="脫離一般戰鬥 [Q]">逃跑[Q]</button>
            </div>
          </div>

          <!-- 右下角：仙劍1經典人物頭像體力真氣牌 -->
          <div id="battle-hero-cards" class="battle-hero-cards"></div>
        </div>
      </div>

      <!-- 戰勝結算牌 -->
      <div id="victory-modal" class="sub-modal hidden">
        <div class="pal-frame victory-card">
          <h3>⚔️ 除魔奏凱 ⚔️</h3>
          <div id="victory-body" class="victory-body"></div>
          <button id="btn-victory-ok" class="pal-btn">收劍前行 [Space]</button>
        </div>
      </div>

      <!-- 經典深藍描金半身像對話框 -->
      <div id="dialogue-overlay" class="dialogue-overlay hidden">
        <div id="dialogue-box" class="pal-frame dialogue-box">
          <div class="dlg-portrait-wrap">
            <canvas id="dlg-portrait" width="104" height="104"></canvas>
          </div>
          <div class="dlg-content">
            <div id="dlg-speaker" class="dlg-speaker">陸逍</div>
            <div id="dlg-text" class="dlg-text"></div>
            <div id="dlg-choices" class="dlg-choices"></div>
            <div class="dlg-next-hint">點擊或按 [空白鍵] 繼續 ▾</div>
          </div>
        </div>
      </div>

      <!-- 角色登場定場詩水墨捲軸 -->
      <div id="poetry-overlay" class="poetry-overlay hidden">
        <div class="poetry-scroll">
          <div id="poetry-title" class="poetry-title"></div>
          <div id="poetry-body" class="poetry-body"></div>
          <div class="poetry-tip">— 點擊任意處入畫 —</div>
        </div>
      </div>
      <!-- 輕量浮動提示（置於畫布視窗頂端中央，絕不遮擋手機頂欄） -->
      <div id="toast-container" class="toast-container"></div>
    </div>
  </main>

  <!-- ================= 仙劍1經典系統大選單 ================= -->
  <div id="menu-modal" class="modal-backdrop hidden">
    <div class="pal-frame menu-window">
      <div class="menu-header">
        <nav class="menu-tabs">
          <button data-menutab="status" class="active">狀態</button>
          <button data-menutab="magic">仙術</button>
          <button data-menutab="items">物品</button>
          <button data-menutab="equip">裝備</button>
          <button data-menutab="gu">煉蠱皿</button>
          <button data-menutab="lore">六界九泉錄</button>
          <button data-menutab="system">存檔系統</button>
        </nav>
        <button id="btn-menu-close" class="pal-btn-xs">✕ 返回</button>
      </div>
      <div id="menu-body" class="menu-body"></div>
    </div>
  </div>

  <!-- ================= 藥鋪 / 神兵坊買賣視窗 ================= -->
  <div id="shop-modal" class="modal-backdrop hidden">
    <div class="pal-frame menu-window">
      <div class="menu-header">
        <h3 id="shop-title">市集商號</h3>
        <button id="btn-shop-close" class="pal-btn-xs">✕ 告辭</button>
      </div>
      <div id="shop-body" class="menu-body"></div>
    </div>
  </div>

  <!-- ================= 史詩結局通關卷軸 ================= -->
  <div id="ending-overlay" class="poetry-overlay hidden">
    <div class="poetry-scroll ending-scroll">
      <div id="ending-badge" class="ending-badge"></div>
      <h2 id="ending-title" class="ending-title"></h2>
      <div id="ending-poem" class="poetry-body"></div>
      <div id="ending-stats" class="ending-stats"></div>
      <div class="ending-btns">
        <button id="btn-ending-roam" class="pal-btn">留步江湖（自由探索／挑戰其他結局）</button>
        <button id="btn-ending-title" class="pal-btn">返回首頁</button>
      </div>
    </div>
  </div>

  <!-- 依序載入模組（支援本地雙擊 file:// 與 HTTP 伺服器零建置直開） -->
  <script src="js/data/lore_codex.js"></script>
  <script src="js/data/items_skills.js"></script>
  <script src="js/data/characters_enemies.js"></script>
  <script src="js/data/maps_chapters.js"></script>
  <script src="js/data/story_events.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/graphics.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
